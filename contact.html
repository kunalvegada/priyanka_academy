      <img src="logo_left_con.jpeg" alt="Logo 1" class="logo left" style="max-width:100%; height:auto;">

      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <h2 id="center">Contact Us</h2>
      <form action="https://formspree.io/f/xvgparep" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="mobile_no">Mobile No:</label>
        <input type="tel" id="mobile_number" name="mobile_no" placeholder="+country_code number" required>
        <small>Format: +91 1234567890</small>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" cols="30" required></textarea>

        <input type="submit" value="Send">
      </form>
    </div>
  </main>
